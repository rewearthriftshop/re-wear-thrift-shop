${S.looks.length?`<div class="pn"><h3>Look tersimpan</h3>${S.looks.map((l,i)=>`<span class="chip" onclick="A.loadLook(${l.id})">Look ${i+1} (${l.it.length} item)</span> `).join('')}</div>`:''}</div></div>`}
function vReq(){return `<div class="crumb"><a onclick="A.go('home')">Beranda</a> / Request</div><div class="two" style="margin:20px 0"><div class="form"><h1 class="serif" style="font-size:38px;margin:0">Cari yang belum ada?<br>Request di sini</h1><p style="color:var(--muted)">Kami carikan, kurasi, lalu kabari lewat notifikasi dan WhatsApp saat barangnya ready.</p><form onsubmit="event.preventDefault();A.reqSub(this)"><label>Jenis barang</label><select name="jenis">${Object.keys(K).map(k=>`<option value="${k}">${K[k][0][0]}</option>`).join('')}</select><label>Warna</label><select name="warna">${COL.map(c=>`<option>${c[0]}</option>`).join('')}</select><label>Ukuran</label><select name="uk">${['XS','S','M','L','XL'].map(x=>`<option ${x==='M'?'selected':''}>${x}</option>`).join('')}</select><label>Budget</label><select><option>Di bawah Rp 60.000</option><option selected>Rp 60.000 - Rp 100.000</option><option>Rp 100.000 - Rp 200.000</option></select><label>Foto referensi (opsional)</label><input type="file" accept="image/*"><div class="acts"><button class="btn" style="width:100%">Kirim Request</button></div></form></div><div><h2 class="serif" style="font-size:28px;margin:0 0 12px">Request saya</h2>${S.reqs.map(r=>r.st==='ready'?`<div class="st ready"><div class="item" style="background:none;border:0;padding:0"><div class="ca">${pic(P(r.pid))}</div><div class="inf"><b>${r.t}</b><div style="font-size:13px">${P(r.pid).n} · ${rp(P(r.pid).price)}</div><span class="pl g">READY</span></div></div><div class="acts"><button class="btn sm" onclick="A.add(${r.pid})">Beli sekarang (24 jam)</button><button class="btn o sm" onclick="A.go('produk/${r.pid}')">Lihat detail</button></div></div>`:`<div class="st"><b>${r.t}</b><div style="font-size:13px;color:var(--muted)">Menunggu hasil sourcing</div><div class="acts"><span class="pl m">Menunggu</span><button class="btn o sm" onclick="A.reqReady(${r.id})">Simulasikan notifikasi ready</button></div></div>`).join('')}</div></div>`}
function vvl(){return S.vouch.map(v=>`<div class="ticket"><div><div style="font-size:12px;color:var(--muted)">${v.used?'Sudah dipakai':'Aktif'}</div><b>${v.code}</b></div><b>- ${rp(v.val)}</b></div>`).join('')||'<div class="empty">Belum ada voucher.</div>'}
function vTI(){return `<div class="crumb"><a onclick="A.go('home')">Beranda</a> / Trade-in</div><div class="two" style="margin:20px 0"><div class="form"><h1 class="serif" style="font-size:38px;margin:0">Tukar baju bekasmu, dapat voucher belanja</h1><form oninput="A.estim(this)" onsubmit="event.preventDefault();A.tiSub(this)"><label>Jenis</label><select name="jenis"><option>Atasan</option><option>Bawahan</option><option>Outer</option><option>Dress</option></select><label>Kondisi</label><select name="kond"><option value="1">Seperti baru</option><option value=".75" selected>Bagus</option><option value=".45">Ada cacat minor</option></select><label>Brand</label><select name="brand"><option value="1">Brand biasa</option><option value="1.3">Brand populer</option><option value="1.8">Brand premium</option></select><label>Foto baju (depan, belakang, label)</label><input type="file" accept="image/*" multiple><div class="acts"><button class="btn" style="width:100%">Ajukan Trade-in</button></div></form></div><div><div class="big2"><div>Estimasi nilai voucher</div><h2 id="est">Rp 25.000</h2><div style="color:#eaf3fd;font-size:13px">Nilai final ditentukan setelah kurasi tim. Berlaku 60 hari.</div></div><h3 class="serif" style="font-size:24px;margin:18px 0 6px">Voucher saya</h3>${vvl()}<p style="color:var(--muted);font-size:13px">Kirim lewat drop-off di titik re:wear atau jemput kurir (gratis ongkir untuk 3 item atau lebih).</p></div></div>`}
function vCheckout(){const c=calc();if(!c.items.length)return `<div class="empty"><h2 class="serif">Keranjangmu masih kosong</h2><button class="btn" onclick="A.go('katalog')">Mulai belanja</button></div>`;const a=S.addr;
return `<h3 class="lbl" style="margin-top:20px">CHECKOUT</h3><div class="cw"><div><div class="lbl" style="margin-top:0">Alamat Pengiriman</div><div class="addr"><div>${a.n}<br>${a.tel}</div><div style="max-width:420px">${a.a}</div><button class="btn sm" onclick="A.addrEdit()">UBAH</button></div><div class="lbl">Produk Dibeli</div>${c.items.map(p=>`<div class="item"><div class="ca">${pic(p)}</div><div class="inf"><b>${p.n}</b><div style="font-size:12px;color:var(--muted)">Size ${p.size} · ${p.st} · <span data-exp="${S.cart.find(x=>x.id===p.id).exp}"></span></div><div class="pr">${rp(p.price)}</div></div><button class="tb" onclick="A.del(${p.id})">Hapus</button></div>`).join('')}<div class="lbl">Pengiriman</div>${[[18000,'Reguler','2-3 hari (gratis jika belanja min. Rp150.000)'],[30000,'Instan','hari ini']].map(o=>`<div class="pay" onclick="A.ship(${o[0]})"><input type="radio" ${S.ship===o[0]?'checked':''}><b>${o[1]} · ${o[2]}</b></div>`).join('')}<div class="lbl">Pesan (Opsional)</div><textarea rows="3"></textarea><div class="lbl">Payment</div>${[['QRIS','QRIS','Qris'],['KARTU','💳','Kartu Debit/Kredit'],['VA','🏦','Transfer Bank (Virtual Account)'],['COD','🤝','Cash On Delivery']].map(o=>`<label class="pay"><i>${o[1]}</i><b>${o[2]}</b><input type="radio" name="p" ${S.pay===o[0]?'checked':''} onchange="A.payM('${o[0]}')"></label>`).join('')}</div><div class="sum"><h3 class="serif" style="margin:0 0 8px;font-size:24px">Ringkasan</h3><div class="sr"><span>Subtotal</span><span>${rp(c.sub)}</span></div>${c.disc?`<div class="sr"><span>${c.dl}</span><span>- ${rp(c.disc)}</span></div>`:''}<select onchange="A.vch(this.value)"><option value="">Pilih voucher</option>${S.vouch.filter(v=>!v.used).map(v=>`<option value="${v.code}" ${S.applied===v.code?'selected':''}>${v.code} (- ${rp(v.val)})</option>`).join('')}</select>${c.vv?`<div class="sr"><span>Voucher</span><span>- ${rp(c.vv)}</span></div>`:''}<div class="sr"><span>Tax (11%)</span><span>${rp(c.tax)}</span></div><div class="sr"><span>Shipping</span><span>${c.ship?rp(c.ship):'Gratis'}</span></div><div class="sr"><span>Cuci &amp; steril</span><span>Gratis</span></div><div class="sr t"><span>Total</span><span>${rp(c.tot)}</span></div><button class="btn" style="width:100%;margin-top:12px" onclick="A.order()">Buat Pesanan</button><p style="font-size:12px;color:var(--muted);margin:10px 0 0">Garansi retur 7 hari berlaku.</p></div></div>`}
function qr(){let s=7,r=()=>(s=s*16807%2147483647)/2147483647,n=25,h='';const f=(x,y)=>(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on;if(f(x,y)){const a=x<7?x:x-(n-7),b=y<7?y:y-(n-7);on=a===0||a===6||b===0||b===6||(a>1&&a<5&&b>1&&b<5)}else on=r()>.5;if(on)h+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="-1 -1 27 27" fill="#000" style="width:240px;background:#fff">${h}</svg>`}
function vPay(){const o=S.cur;if(!o)return '<div class="empty">Belum ada pesanan untuk dibayar.</div>';const m={QRIS:'QRIS',KARTU:'Kartu Debit/Kredit',VA:'Virtual Account'}[o.pay];return `<h2 class="serif" style="font-size:34px;color:var(--green)">Payment</h2><div class="sr"><b style="font-size:16px">Total Pembayaran</b><b style="color:var(--red);font-size:16px">${rp(o.total)}</b></div><div class="sr"><b style="font-size:16px">Bayar Dalam</b><span class="timer" id="cd">23 : 59 : 55</span></div><div class="sr" style="justify-content:flex-end;font-size:11px" id="due"></div><div style="text-align:center;margin-top:20px"><b style="font-size:18px">${m}</b><div style="margin:12px auto">${o.pay==='QRIS'?qr():`<div class="box k" style="max-width:340px;margin:12px auto"><b>${o.pay==='VA'?'No. VA: 8808 1234 5678 9012':'Masukkan detail kartu di halaman aman bank (simulasi).'}</b></div>`}</div><button class="btn" onclick="A.finish(S.cur)">Simulasi: Saya Sudah Bayar</button></div>`}
function vOk(){const o=S.orders[0];if(!o)return '<div class="empty">Belum ada pesanan.</div>';return `<div class="success"><div class="ok">✔</div><b style="font-size:17px">Pembayaran Telah Berhasil</b><p style="font-size:15px;margin:6px 0 0">Terimakasih Telah Berbelanja di re:wear</p><p style="color:var(--muted);margin:4px 0 0">No. ${o.no}</p></div><div class="two" style="margin-top:24px"><div><h3 class="serif" style="font-size:24px;margin:0 0 10px">Pesananmu</h3>${o.items.map(i=>`<div class="item"><div class="ca">${pic(P(i))}</div><div class="inf"><b>${P(i).n}</b><div class="pr">${rp(P(i).price)}</div></div></div>`).join('')}<p>Total dibayar <b>${rp(o.total)}</b></p><div class="acts"><button class="btn o sm" onclick="A.retur()">Ajukan retur (7 hari)</button><button class="btn o sm" onclick="toast('Tim re:wear akan menghubungimu lewat WhatsApp.')">Hubungi kami</button></div></div><div><h3 class="serif" style="font-size:24px;margin:0">Status pesanan</h3><div class="tlv">${ST.map((s,i)=>`<div class="${i<o.stage?'d':i===o.stage?'n':''}"><i>${i<o.stage?'✓':''}</i>${s}${i===o.stage?' (sedang proses)':''}</div>`).join('')}</div><button class="btn sm" ${o.stage>=5?'disabled':''} onclick="A.next()">Simulasikan tahap berikutnya</button></div></div><div style="text-align:center;margin-top:24px"><button class="btn" onclick="A.go('home')">Kembali ke Home</button></div>`}
function vWish(){const l=PR.filter(p=>S.wish.has(p.id));return `<h1 class="serif" style="font-size:38px;margin:24px 0">Wishlist</h1>${l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<div class="empty">Belum ada item. Tekan ikon hati di kartu produk.</div>'}`}
function vGaya(){return `<h1 class="serif" style="font-size:38px;margin:24px 0 4px">Koleksi gaya</h1><p style="color:var(--muted)">Brand spesialis dengan model yang paling disukai Gen Z.</p><div class="gaya" style="grid-template-columns:repeat(3,1fr)">${STY.map(s=>{const it=PR.filter(p=>p.st===s&&!p.sold).slice(0,3);return `<div style="background:#${STC[s][0]};color:#${STC[s][1]};min-height:300px" onclick="A.style('${s}')"><div class="im">${it.map(p=>`<span>${pic(p)}</span>`).join('')}</div><b style="font-size:26px">${s}</b><small>${PR.filter(p=>p.st===s&&!p.sold).length} item tersedia</small></div>`}).join('')}</div>`}
function vAkun(){return `<h1 class="serif" style="font-size:38px;margin:24px 0">Akun saya</h1><div class="two"><div><h3 class="serif" style="font-size:26px">Voucher</h3>${vvl()}<button class="btn o sm" onclick="A.go('tradein')">Tambah lewat Trade-in</button></div><div><h3 class="serif" style="font-size:26px">Ringkasan</h3><p>Wishlist: ${S.wish.size} item<br>Request: ${S.reqs.length}<br>Look tersimpan: ${S.looks.length}<br>Pesanan: ${S.orders.length}</p>${S.orders.length?`<h3 class="serif" style="font-size:22px">Riwayat pesanan</h3>${S.orders.map(o=>`<div class="st"><b>${o.no}</b> · ${rp(o.total)}<br><small>${ST[o.stage]} · ${o.items.length} item</small></div>`).join('')}<button class="btn sm" onclick="A.go('sukses')">Lacak pesanan terbaru</button>`:''}</div></div>`}
/* ===== ROUTER ===== */
function route(keep){const h=(location.hash.slice(2)||'home').split('/'),r=h[0],y=scrollY;let v;
if(r==='home')v=vHome();else if(r==='katalog')v=vKat();else if(r==='produk'){if(!keep)S.gv='depan';v=vDet(+h[1])}else if(r==='mix')v=vMix();else if(r==='bundle')v=`<h1 class="serif" style="font-size:38px;margin:24px 0 4px">Bundle outfit</h1><p style="color:var(--muted)">Malas mix? Beli satu setelan lengkap, hemat 15%.</p>${bunHtml(BUN)}`;else if(r==='request')v=vReq();else if(r==='tradein')v=vTI();else if(r==='checkout'||r==='keranjang')v=vCheckout();else if(r==='bayar')v=vPay();else if(r==='sukses')v=vOk();else if(r==='wishlist')v=vWish();else if(r==='gaya')v=vGaya();else if(r==='akun')v=vAkun();else v=vHome();
$('#app').innerHTML=v;hdr();if(r==='katalog')grid();if(r==='mix')pickList();if(r==='tradein')A.estim($('form'));if(r==='bayar')startTimer();$('#mega').style.display='none';scrollTo(0,keep?y:0);if(r==='home')startHero()}
A.slide=i=>{const s=document.querySelectorAll('.sl'),d=document.querySelectorAll('.dots i');s.forEach((x,k)=>x.classList.toggle('on',k===i));d.forEach((x,k)=>x.classList.toggle('on',k===i));A._s=i};
let hT;function startHero(){clearInterval(hT);A._s=0;hT=setInterval(()=>{if(!$('#hero'))return clearInterval(hT);A.slide(((A._s||0)+1)%3)},5500)}
let tm;function startTimer(){clearInterval(tm);let t=86395;const d=new Date(Date.now()+t*1000),z=n=>String(n).padStart(2,'0');const du=$('#due');if(du)du.textContent='Jatuh Tempo '+d.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})+', '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});const u=()=>{const c=$('#cd');if(!c)return clearInterval(tm);c.textContent=z(t/3600|0)+' : '+z(t%3600/60|0)+' : '+z(t%60);t--};u();tm=setInterval(u,1000)}
addEventListener('hashchange',()=>route());
document.addEventListener('click',e=>{if(!e.target.closest('.sb'))$('#sug').style.display='none'});
setInterval(()=>{const now=Date.now();let drop=false;S.cart=S.cart.filter(c=>{if(c.exp<now){drop=true;return false}return true});if(drop){save();toast('Reservasi habis, barang dikembalikan ke katalog.');hdr();if(/checkout|keranjang/.test(location.hash))route(1)}document.querySelectorAll('[data-exp]').forEach(e=>{const s=Math.max(0,Math.floor((e.dataset.exp-now)/1000));e.textContent='Direservasi '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')})},1000);
addEventListener('keydown',e=>{if(e.key==='Escape'){A.close();A.cart(0)}});
route();
</script>
</body>
